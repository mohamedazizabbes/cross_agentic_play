<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fact-Check Result</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 360px; padding: 0; margin: 0; font-size: 13px; color: #333; }
    .header { padding: 12px 14px; background: #2e7d32; color: white; font-size: 14px; font-weight: 600; }
    .content { padding: 12px 14px; }

    /* Loading */
    .loading { text-align: center; padding: 24px 0; color: #666; }
    .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #ddd; border-top-color: #2e7d32; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error { padding: 12px; background: #ffebee; color: #c62828; border-radius: 4px; border: 1px solid #ffcdd2; }

    /* No claims */
    .empty { text-align: center; padding: 16px 0; color: #888; font-style: italic; }

    /* Summary */
    .summary { margin-bottom: 10px; padding: 8px 10px; background: #f5f5f5; border-radius: 4px; font-size: 12px; }
    .verified { color: #2e7d32; font-weight: 600; }
    .contradicted { color: #c62828; font-weight: 600; }
    .unverified { color: #757575; font-weight: 600; }

    /* Claim card */
    .claim { margin-bottom: 10px; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; background: #fafafa; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-weight: 600; font-size: 11px; text-transform: uppercase; }
    .badge-verified { background: #e8f5e9; color: #2e7d32; }
    .badge-contradicted { background: #ffebee; color: #c62828; }
    .badge-unverified { background: #f5f5f5; color: #757575; }
    .claim-text { margin: 6px 0 4px 0; line-height: 1.4; }
    .claim-note { color: #555; font-size: 12px; font-style: italic; margin-top: 4px; }
    .sources { margin-top: 6px; font-size: 11px; color: #666; }
    .sources strong { color: #444; }
    .source-item { word-break: break-all; }
  </style>
</head>
<body>
  <div class="header">Fact-Check</div>
  <div class="content">
    <div id="output">
      <div class="loading">
        <div class="spinner"></div>
        <div>Checking facts...</div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
