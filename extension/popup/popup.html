<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fact-Check Result</title>
  <style>
    body {font-family: Arial, sans-serif; width: 320px; padding: 12px; font-size: 13px;}
    .summary {margin-bottom: 10px; padding: 8px; background: #f0f0f0; border-radius: 4px;}
    .verified {color: #2e7d32;}
    .contradicted {color: #c62828;}
    .unverified {color: #757575;}
    .claim {margin-bottom: 10px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; background: #fafafa;}
    .badge-verified {background: #e8f5e9; color: #2e7d32; padding: 2px 6px; border-radius: 3px; font-weight: bold; font-size: 11px;}
    .badge-contradicted {background: #ffebee; color: #c62828; padding: 2px 6px; border-radius: 3px; font-weight: bold; font-size: 11px;}
    .badge-unverified {background: #f5f5f5; color: #757575; padding: 2px 6px; border-radius: 3px; font-weight: bold; font-size: 11px;}
    .claim-text {margin: 6px 0 4px 0; line-height: 1.4;}
    .claim-note {color: #555; font-size: 12px; font-style: italic;}
  </style>
</head>
<body>
  <h4>Fact-Check Result</h4>
  <div id="output">Waiting for result...</div>
  <script src="popup.js"></script>
</body>
</html>
